version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:1.3.4.dev19
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      # This line mounts a local directory into the container for persistence
      # The data will be saved in a folder named 'chroma' in the data subfolder of the current
      # directory as your docker-compose.yml file.
      - ./data/chroma:/chroma
    environment:
      # This tells Chroma to run in a persistent mode
      - IS_PERSISTENT=TRUE
      # This specifies the path *inside the container* where data should be stored
      # It MUST match the target path of the volume mount above
      - PERSIST_DIRECTORY=/chroma