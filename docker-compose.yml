services:
  # LangGraph RAG application
  rag:
    image: askme-rag:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askme-rag
    ports:
      - "8123:8123"
    volumes:
      - ./log:/app/log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Tavily API
      - TAVILY_API_KEY=${TAVILY_API_KEY:-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}
      # LLM Provider - set to "ollama", or "gemini"
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      # Ollama Configuration (used when LLM_PROVIDER=ollama for local Ollama)
      - OLLAMA_MODEL=${OLLAMA_MODEL:-phi3:instruct}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Gemini Configuration (used when LLM_PROVIDER=gemini)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyBdCZgCIEinfR--LOCGI0KACrL4ifWIzW8}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      # Model Configuration
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS:-512}
      # LangSmith Tracing
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-askme-iimb-rag}
      # ChromaDB Configuration - connect to the Chroma service by its Docker service name
      - CHROMA_SERVER_HOST=${CHROMA_SERVER_HOST:-chromadb}
      - CHROMA_SERVER_PORT=${CHROMA_SERVER_PORT:-8000}
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-iimb-rag}
      - CHROMA_N_RESULTS=${CHROMA_N_RESULTS:-10}
      # Application Logging
      - APP_LOG=/app/log/rag_app.log
    networks:
      - askme-network

networks:
  askme-network:
    external: true